<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counterpoint</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="22" height="22" />
    <h1>Counterpoint</h1>
    <nav>
      <button class="tab active" data-tab="analysis">Analysis</button>
      <button class="tab" data-tab="settings">Settings</button>
      <button class="tab" data-tab="prompt">Prompt</button>
    </nav>
  </header>

  <main id="tab-analysis" class="pane active">
    <div class="actions">
      <button id="analyse" class="primary">Analyse this page</button>
      <button id="reanalyse" title="Ignore cache and re-run" hidden>&#x21bb;</button>
    </div>
    <p id="status" class="status" hidden></p>
    <div id="results" hidden></div>
    <p class="hint" id="empty-hint">
      Open a news article, then hit <em>Analyse</em>. Select part of the page
      first to analyse just the selection.
    </p>
  </main>

  <main id="tab-settings" class="pane">
    <label>Provider
      <select id="provider"></select>
    </label>
    <label>Model
      <input id="model" type="text" spellcheck="false" list="model-options" />
      <datalist id="model-options"></datalist>
      <span class="hint" id="model-hint"></span>
    </label>
    <label id="baseurl-row">Base URL
      <input id="baseurl" type="text" spellcheck="false" />
      <span class="hint">Leave blank for the provider default. Point at any OpenAI-compatible server.</span>
    </label>
    <label id="key-row">API key
      <input id="apikey" type="password" spellcheck="false" autocomplete="off" />
      <span class="hint">Sent only to the provider above, from this browser. Never anywhere else.</span>
    </label>
    <label class="check" id="remember-row">
      <input id="remember" type="checkbox" />
      Remember key on this device
      <span class="hint">Off: the key is held in memory and cleared when the browser closes. On: it is stored unencrypted in extension storage - anyone with access to this computer profile could read it.</span>
    </label>
    <p class="hint">Changes save automatically.</p>
    <p id="settings-status" class="status" hidden></p>
  </main>

  <main id="tab-prompt" class="pane">
    <p class="hint">
      This system prompt drives the analysis - edit it freely. The JSON output
      format is enforced separately, so you can't break the display.
    </p>
    <textarea id="prompt-text" spellcheck="false"></textarea>
    <div class="actions">
      <button id="save-prompt" class="primary">Save prompt</button>
      <button id="reset-prompt">Reset to default</button>
    </div>
    <p id="prompt-status" class="status" hidden></p>
  </main>

  <script type="module" src="panel.js"></script>
</body>
</html>
